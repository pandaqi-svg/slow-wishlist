<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>愿望清单｜理性消费愿望清单</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--bg:#f6f7f2;--panel:#fffdf8;--text:#33413b;--muted:#879189;--line:#e6e9e2;--accent:#7f9b89;--accent-dark:#5f7869;--soft:#edf2ed;--danger:#b56f68;--shadow:0 16px 40px rgba(63,80,70,.08);--radius:22px}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at top left,rgba(182,201,187,.24),transparent 32%),linear-gradient(180deg,#f8f8f3 0%,#f2f4ee 100%);font-family:"Noto Serif SC","Songti SC","STSong","PingFang SC",serif}
    button,input,select{font:inherit} button{cursor:pointer}.app{width:min(1120px,calc(100% - 28px));margin:38px auto 68px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.eyebrow{color:var(--accent-dark);font-size:13px;letter-spacing:.22em;margin-bottom:8px}h1{margin:0;font-size:clamp(34px,6vw,56px);font-weight:500;letter-spacing:.08em}.subtitle{margin:10px 0 0;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:14px}.quote{max-width:310px;color:var(--muted);line-height:1.8;text-align:right;font-size:14px}.grid{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}.card{background:rgba(255,253,248,.94);border:1px solid rgba(226,230,221,.9);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(8px)}.side{padding:22px;position:sticky;top:20px}.side h2{margin:0 0 18px;font-size:18px;font-weight:500}.mode-note{margin:-8px 0 18px;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;line-height:1.65}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}label{font-family:"PingFang SC",sans-serif;font-size:13px;color:var(--muted)}input[type=text],input[type=number],input[type=file],select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;color:var(--text);outline:none;transition:.2s}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,155,137,.12)}input[type=file]{padding:9px;font-family:"PingFang SC",sans-serif;font-size:12px;color:var(--muted)}.upload-box{border:1.5px dashed #cfd8d0;border-radius:16px;padding:12px;background:#fafbf8;margin-bottom:14px}.preview{display:none;width:100%;height:170px;object-fit:contain;border-radius:12px;background:#f0f2ed;margin-top:10px}.preview.show{display:block}.ocr-status{display:none;align-items:center;gap:9px;margin:10px 0 2px;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px}.ocr-status.show{display:flex}.spinner{width:15px;height:15px;border:2px solid #d8ded8;border-top-color:var(--accent-dark);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ocr-result{display:none;margin:12px 0 14px;padding:11px 12px;border-radius:12px;background:#f5f7f3;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;line-height:1.65}.ocr-result.show{display:block}.primary,.secondary{width:100%;border-radius:13px;padding:12px 16px}.primary{border:none;color:#fff;background:var(--accent-dark)}.secondary{border:1px solid var(--line);color:var(--accent-dark);background:#fff;margin-bottom:10px}.primary:disabled,.secondary:disabled{opacity:.55;cursor:not-allowed}.budget{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.budget-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-family:"PingFang SC",sans-serif;font-size:13px}.budget-row span:first-child{color:var(--muted)}.budget-row strong{font-size:15px}.progress{height:8px;margin:12px 0 4px;background:var(--soft);border-radius:99px;overflow:hidden}.progress>div{width:0;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:99px}.tip{margin:12px 0 0;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;line-height:1.7}.panel{overflow:hidden}.tabs{display:flex;align-items:center;gap:8px;padding:18px 20px 0}.tab{border:none;background:transparent;color:var(--muted);padding:10px 14px;border-radius:999px;font-family:"PingFang SC",sans-serif;font-size:14px}.tab.active{color:var(--accent-dark);background:var(--soft);font-weight:600}.table-head,.wish{display:grid;grid-template-columns:56px minmax(180px,1fr) 110px 86px 84px 78px;align-items:center}.table-head{margin-top:14px;padding:12px 20px;background:#f7f8f4;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.list{min-height:260px}.wish{min-height:74px;padding:10px 20px;border-bottom:1px solid var(--line)}.wish:hover{background:#fffefa}.rank{color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px}.name{min-width:0}.name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.price{font-family:"PingFang SC",sans-serif;font-size:14px}.platform-badge{display:inline-flex;min-width:50px;justify-content:center;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--accent-dark);font-family:"PingFang SC",sans-serif;font-size:12px}.thumb-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0;overflow:hidden}.thumb-btn img{width:100%;height:100%;object-fit:cover}.move{display:flex;gap:5px}.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;color:var(--accent-dark);border-radius:9px}.icon-btn:disabled{opacity:.3}.actions{display:flex;justify-content:flex-end;align-items:center;gap:7px}.check{appearance:none;width:22px;height:22px;border:1.5px solid var(--accent);border-radius:7px;display:grid;place-content:center;background:#fff}.check::before{content:"✓";color:#fff;font-size:14px;transform:scale(0)}.check:checked{background:var(--accent-dark)}.check:checked::before{transform:scale(1)}.delete{border:none;background:transparent;color:#b9bdb8;font-size:18px}.empty{padding:66px 20px;text-align:center;color:var(--muted);font-family:"PingFang SC",sans-serif;line-height:1.8}.footer-note{padding:16px 20px 20px;color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;text-align:right}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:24px;background:rgba(34,43,38,.62)}.modal.show{display:grid}.modal-content{max-width:min(760px,92vw);max-height:82vh;border-radius:18px;overflow:hidden;background:#fff;position:relative}.modal-content img{display:block;max-width:100%;max-height:82vh;object-fit:contain}.modal-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.88);font-size:20px}
    @media(max-width:860px){header{align-items:flex-start;flex-direction:column}.quote{text-align:left}.grid{grid-template-columns:1fr}.side{position:static}.table-head{display:none}.wish{grid-template-columns:40px 1fr 76px;grid-template-areas:"rank name actions" "rank meta actions" "rank source actions";gap:7px;padding:14px 16px}.rank{grid-area:rank}.name{grid-area:name}.price{grid-area:meta}.platform{grid-area:source}.thumb{grid-area:meta;margin-left:95px}.move{grid-area:rank;margin-top:26px;flex-direction:column}.actions{grid-area:actions}.price::before{content:"价格 ";color:var(--muted)}}
  </style>
</head>
<body>
<main class="app">
<header><div><div class="eyebrow">BUY SLOWLY, LIVE LIGHTLY</div><h1>愿望清单</h1><p class="subtitle">喜欢可以慢一点决定。</p></div><div class="quote">把心动留在清单里，<br>把决定交给更冷静的自己。</div></header>
<section class="grid">
<aside class="card side">
<h2>上传商品截图</h2><p class="mode-note">选择截图后，会自动识别商品名称和价格。识别结果可以修改，再选择商品来源平台。</p>
<form id="wishForm">
<div class="upload-box"><div class="field" style="margin-bottom:0"><label for="wishImage">商品截图</label><input id="wishImage" type="file" accept="image/*" required></div><img id="imagePreview" class="preview" alt="商品截图预览"><div id="ocrStatus" class="ocr-status"><span class="spinner"></span><span id="ocrStatusText">正在识别截图中的商品信息……</span></div><div id="ocrResult" class="ocr-result"></div></div>
<div class="field"><label for="wishName">商品名称</label><input id="wishName" type="text" maxlength="100" placeholder="上传截图后自动填写" required></div>
<div class="field"><label for="wishPrice">商品价格</label><input id="wishPrice" type="number" min="0" step="0.01" placeholder="上传截图后自动填写" required></div>
<div class="field"><label for="wishPlatform">收藏平台</label><select id="wishPlatform" required><option value="">请选择平台</option><option>抖音</option><option>淘宝</option><option>拼多多</option><option>京东</option><option>小红书</option><option>其他</option></select></div>
<button id="recognizeBtn" class="secondary" type="button" disabled>重新识别截图</button><button id="submitBtn" class="primary" type="submit">加入愿望清单</button>
</form>
<div class="budget"><h2>本月可选预算</h2><div class="field"><label for="budgetInput">预算金额</label><input id="budgetInput" type="number" min="0" step="0.01" placeholder="例如：2000"></div><div class="budget-row"><span>待实现愿望总额</span><strong id="pendingTotal">¥0.00</strong></div><div class="budget-row"><span>本月已实现</span><strong id="completedTotal">¥0.00</strong></div><div class="budget-row"><span>剩余可选预算</span><strong id="remainingBudget">—</strong></div><div class="progress"><div id="budgetProgress"></div></div><p class="tip" id="budgetTip">设置预算后，可以更直观地判断本月先满足哪些愿望。</p></div>
</aside>
<section class="card panel"><div class="tabs"><button class="tab active" data-tab="pending">待实现 <span id="pendingCount">0</span></button><button class="tab" data-tab="completed">已完成 <span id="completedCount">0</span></button></div><div class="table-head"><span>顺序</span><span>愿望</span><span>价格</span><span>平台</span><span>图片</span><span style="text-align:right">状态</span></div><div id="wishList" class="list"></div><div class="footer-note">愿望数据和截图仅保存在当前浏览器中，不会上传到服务器。</div></section>
</section></main>
<div class="modal" id="imageModal" aria-hidden="true"><div class="modal-content"><button class="modal-close" id="modalClose">×</button><img id="modalImage" alt="愿望图片预览"></div></div>
<script>
const STORAGE_KEY="slow-wishlist-v2",LEGACY_KEY="slow-wishlist-v1",BUDGET_KEY="slow-wishlist-budget-v1";
let wishes=JSON.parse(localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_KEY)||"[]").map(w=>({...w,platform:w.platform||"未标记"})),currentTab="pending",currentImageData="",recognizing=false;
const $=id=>document.getElementById(id),form=$("wishForm"),nameInput=$("wishName"),priceInput=$("wishPrice"),imageInput=$("wishImage"),platformInput=$("wishPlatform"),list=$("wishList"),budgetInput=$("budgetInput"),imagePreview=$("imagePreview"),ocrStatus=$("ocrStatus"),ocrStatusText=$("ocrStatusText"),ocrResult=$("ocrResult"),recognizeBtn=$("recognizeBtn"),submitBtn=$("submitBtn"),modal=$("imageModal"),modalImage=$("modalImage");
budgetInput.value=localStorage.getItem(BUDGET_KEY)||"";
const money=v=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",minimumFractionDigits:2}).format(Number(v||0));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(wishes));render()}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file)})}
function normalizeText(t){return t.replace(/[|｜]/g," ").replace(/\s+/g," ").replace(/￥/g,"¥").trim()}
function extractPrice(text){const c=text.replace(/,/g,"");const ps=[/(?:¥|￥|RMB|CNY)\s*([0-9]{1,6}(?:\.[0-9]{1,2})?)/ig,/(?:到手价|券后价|活动价|现价|售价|价格|优惠价)\s*[:：]?\s*([0-9]{1,6}(?:\.[0-9]{1,2})?)/ig,/([0-9]{1,6}(?:\.[0-9]{1,2})?)\s*元/g];const a=[];ps.forEach(p=>{let m;while((m=p.exec(c))!==null){const v=Number(m[1]);if(v>0&&v<1000000)a.push(v)}});if(!a.length)(c.match(/\b([1-9][0-9]{0,4}(?:\.[0-9]{1,2})?)\b/g)||[]).map(Number).filter(v=>v>=5&&v<100000).forEach(v=>a.push(v));return a.length?Math.min(...a):""}
function extractName(text){const stop=["淘宝","天猫","拼多多","抖音","京东","小红书","直播","商品","店铺","客服","销量","已售","包邮","优惠","券后","到手价","活动价","立即购买","加入购物车","关注","分享","评价","详情","推荐","搜索","首页","消息","购物车","付款","领券","退货","运费险","官方旗舰店","品牌","规格","颜色","尺码","月销","已拼"];const lines=text.split(/\n+/).map(normalizeText).filter(Boolean).filter(x=>x.length>=4&&x.length<=80).filter(x=>!(/^[¥￥\d\s.,%折元]+$/.test(x))).filter(x=>!stop.some(w=>x===w||x.startsWith(w+" "))).filter(x=>!/(立即购买|加入购物车|领券|优惠券|月销|销量|已售|客服|店铺)/.test(x));if(!lines.length)return"";return lines.map(line=>{let score=Math.min(line.length,40);if(/[\u4e00-\u9fa5]{5,}/.test(line))score+=14;if(/[A-Za-z]{2,}/.test(line))score+=3;if(/\d{4,}/.test(line))score-=10;if(/[¥￥]/.test(line))score-=12;if(stop.some(w=>line.includes(w)))score-=10;return{line,score}}).sort((a,b)=>b.score-a.score)[0].line}
function detectPlatform(text){const p=[["抖音",/抖音|直播间|抖音商城/],["淘宝",/淘宝|天猫|淘金币/],["拼多多",/拼多多|已拼|百亿补贴/],["京东",/京东|京东物流|自营/],["小红书",/小红书|薯店/]];const f=p.find(([,r])=>r.test(text));return f?f[0]:""}
async function recognizeImage(){if(!currentImageData||recognizing)return;recognizing=true;recognizeBtn.disabled=true;submitBtn.disabled=true;ocrStatus.classList.add("show");ocrResult.classList.remove("show");try{const result=await Tesseract.recognize(currentImageData,"chi_sim+eng",{logger:m=>{if(m.status==="recognizing text")ocrStatusText.textContent=`正在识别截图……${Math.round((m.progress||0)*100)}%`}});const text=result.data.text||"",name=extractName(text),price=extractPrice(text),platform=detectPlatform(text);if(name)nameInput.value=name;if(price!=="")priceInput.value=price;if(platform)platformInput.value=platform;const found=[];if(name)found.push(`名称：${name}`);if(price!=="")found.push(`价格：¥${price}`);if(platform)found.push(`平台：${platform}`);ocrResult.innerHTML=found.length?`已自动识别：<br>${found.map(escapeHtml).join("<br>")}<br><span style="color:#b08a4a">请确认识别结果是否准确。</span>`:"没有稳定识别出商品名称或价格，请手动填写。";ocrResult.classList.add("show")}catch(e){ocrResult.textContent="自动识别失败。请检查网络后重试，或手动填写。";ocrResult.classList.add("show")}finally{recognizing=false;recognizeBtn.disabled=false;submitBtn.disabled=false;ocrStatus.classList.remove("show")}}
imageInput.addEventListener("change",async()=>{const f=imageInput.files[0];if(!f)return;currentImageData=await readFile(f);imagePreview.src=currentImageData;imagePreview.classList.add("show");recognizeBtn.disabled=false;await recognizeImage()});recognizeBtn.addEventListener("click",recognizeImage);
form.addEventListener("submit",e=>{e.preventDefault();if(!currentImageData){alert("请先上传商品截图。");return}wishes.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:nameInput.value.trim(),price:Number(priceInput.value),image:currentImageData,platform:platformInput.value,completed:false,createdAt:Date.now(),completedAt:null});form.reset();currentImageData="";imagePreview.src="";imagePreview.classList.remove("show");ocrResult.classList.remove("show");recognizeBtn.disabled=true;save()});
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{currentTab=tab.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));render()}));budgetInput.addEventListener("input",()=>{localStorage.setItem(BUDGET_KEY,budgetInput.value);updateSummary()});
function moveWish(id,d){const v=wishes.filter(w=>currentTab==="completed"?w.completed:!w.completed),i=v.findIndex(w=>w.id===id),j=i+d;if(j<0||j>=v.length)return;const a=wishes.findIndex(w=>w.id===v[i].id),b=wishes.findIndex(w=>w.id===v[j].id);[wishes[a],wishes[b]]=[wishes[b],wishes[a]];save()}function toggleComplete(id,c){const w=wishes.find(w=>w.id===id);w.completed=c;w.completedAt=c?Date.now():null;save()}function deleteWish(id){if(confirm("确定删除这个愿望吗？")){wishes=wishes.filter(w=>w.id!==id);save()}}function showImage(src){modalImage.src=src;modal.classList.add("show")}function closeModal(){modal.classList.remove("show");modalImage.src=""}$("modalClose").onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
function render(){const v=wishes.filter(w=>currentTab==="completed"?w.completed:!w.completed);list.innerHTML=v.length?v.map((w,i)=>`<div class="wish"><div class="rank"><div>NO.${String(i+1).padStart(2,"0")}</div><div class="move"><button class="icon-btn" ${i===0?"disabled":""} onclick="moveWish('${w.id}',-1)">↑</button><button class="icon-btn" ${i===v.length-1?"disabled":""} onclick="moveWish('${w.id}',1)">↓</button></div></div><div class="name"><span class="name-text" title="${escapeHtml(w.name)}">${escapeHtml(w.name)}</span></div><div class="price">${money(w.price)}</div><div class="platform"><span class="platform-badge">${escapeHtml(w.platform||"未标记")}</span></div><div class="thumb"><button class="thumb-btn" onclick="showImage('${w.image}')"><img src="${w.image}" alt=""></button></div><div class="actions"><input class="check" type="checkbox" ${w.completed?"checked":""} onchange="toggleComplete('${w.id}',this.checked)"><button class="delete" onclick="deleteWish('${w.id}')">×</button></div></div>`).join(""):`<div class="empty">${currentTab==="pending"?"这里还没有愿望。<br>下一次心动时，先截一张图放进来。":"还没有已完成的愿望。<br>慢慢来，愿望会一个个实现。"}</div>`;$("pendingCount").textContent=wishes.filter(w=>!w.completed).length;$("completedCount").textContent=wishes.filter(w=>w.completed).length;updateSummary()}
function updateSummary(){const p=wishes.filter(w=>!w.completed).reduce((s,w)=>s+Number(w.price),0),c=wishes.filter(w=>w.completed).reduce((s,w)=>s+Number(w.price),0),b=Number(budgetInput.value||0),r=b?b-c:null;$("pendingTotal").textContent=money(p);$("completedTotal").textContent=money(c);$("remainingBudget").textContent=r===null?"—":money(r);$("budgetProgress").style.width=(b?Math.min(c/b*100,100):0)+"%";$("budgetTip").textContent=!b?"设置预算后，可以更直观地判断本月先满足哪些愿望。":r<0?`本月已超出可选预算 ${money(Math.abs(r))}，可以把后面的愿望留到下个月。`:wishes.some(w=>!w.completed&&Number(w.price)<=r)?`当前剩余预算可覆盖清单中的 ${wishes.filter(w=>!w.completed&&Number(w.price)<=r).length} 个愿望。`:"当前剩余预算暂时无法覆盖待实现愿望，可以继续等待。"}
function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
window.moveWish=moveWish;window.toggleComplete=toggleComplete;window.deleteWish=deleteWish;window.showImage=showImage;save();
</script></body></html>
